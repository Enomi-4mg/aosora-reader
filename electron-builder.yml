appId: jp.miyashu.aosora-reader
productName: 青空Reader
# 配布物のファイル名は ASCII にする。日本語のままだと、配信の経路や展開ツールに
# よっては文字化けした名前で保存される。表示名は productName が持つので困らない。
artifactName: ${name}-${version}-${arch}.${ext}
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
mac:
  target:
    # Apple Silicon と Intel の両方に配る。macos-latest は arm64 だが、
    # ネイティブモジュールが無いので x64 はそのまま組み立てられる。
    #
    # 2つのアーキテクチャは必ず1回のビルドで作ること。ジョブを分けると
    # latest-mac.yml がそれぞれ出来て、Release にまとめるときに
    # 片方がもう片方を上書きし、更新情報から一方の dmg が消える。
    - target: dmg
      arch:
        - arm64
        - x64
    # 自動更新をやるなら zip も要る(Squirrel.Mac は dmg を受け取れない)。
    # 署名しない方針なので自動更新は実装せず、zip も出さない。
    # 署名は mac が Apple Developer Program(年 99 USD)、Windows は
    # SignPath Foundation(OSS 枠・無償)。再開するならそこから。
  category: public.app-category.book
  darkModeSupport: true
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  # ユーザー単位に入れる。管理者権限を求めないので UAC が出ない。
  perMachine: false
  # 既定のまま一気に進めず、インストール先を選べる画面を出す。
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: 青空Reader
